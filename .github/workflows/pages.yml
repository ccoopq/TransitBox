name: Publish TransitBox

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check public source and history
        run: python tools/check_public_source.py --history
      - name: Check website asset access
        env:
          ASSET_KEY: ${{ secrets.TRANSITBOX_ASSETS_SSH_KEY }}
        run: |
          if [ -z "$ASSET_KEY" ]; then
            echo "Configure TRANSITBOX_ASSETS_SSH_KEY to deploy website videos."
            exit 1
          fi
      - name: Checkout private website assets
        uses: actions/checkout@v6
        with:
          repository: ccoopq/TransitBox-private-backup
          ref: main
          path: .publish/private-assets
          ssh-key: ${{ secrets.TRANSITBOX_ASSETS_SSH_KEY }}
          persist-credentials: false
          sparse-checkout: public
      - name: Build website with videos
        run: python tools/build_public.py --private-assets .publish/private-assets/public
      - name: Verify website bundle
        run: python tools/check_publication.py .publish/public-site
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: .publish/public-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
